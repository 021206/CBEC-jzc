server:
  port: 8081

spring:
  datasource:
    # 可新建一个 cbec_test 库
    url: jdbc:mysql://localhost:3306/cbec_test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: CBEC_TEST_SecretKey_ChangeMe
  expiration: 7200000
  refreshExpiration: 604800000