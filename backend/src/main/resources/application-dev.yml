server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cbec?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      config:
        import-check:
          enabled: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:CBEC2026SecretKeyForJWTTokenGenerationMustBeLongEnough}
  expiration: 7200000
  refreshExpiration: 604800000