server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cbec?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 从环境变量读取，如果未设置则默认 123456（本地开发）
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # 从环境变量读取，如果未设置则使用默认密钥（本地开发）
  secret: ${JWT_SECRET:CBEC2026SecretKeyForJWTTokenGenerationMustBeLongEnough}
  expiration: 7200000
  refreshExpiration: 604800000